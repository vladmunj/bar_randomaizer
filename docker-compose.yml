services:
  bot:
    build: .
    container_name: bar_randomizer
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - default
      - wishlist

networks:
  # The wishlist app's network: its API is reachable here as http://server:3000.
  wishlist:
    name: wishlist_default
    external: true
